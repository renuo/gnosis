version: v1.0
name: Initial Pipeline
agent:
  machine:
    type: e2-standard-2
    os_image: ubuntu2404
blocks:
  - name: Checks
    task:
      env_vars:
        - name: PGHOST
          value: "127.0.0.1"
        - name: PGUSER
          value: "postgres"
      jobs:
        - name: Tests
          commands:
            - bin/check
          matrix:
            - env_var: REDMINE_VERSION
              values: ["master", "6.0-stable"]
        - name: Linter
          commands:
            - bin/fastcheck
          env_vars:
            - name: REDMINE_VERSION
              value: "6.0-stable"
      prologue:
        commands:
          - sem-version ruby 3.3
          - checkout
          - sem-service start postgres --username="$PGUSER" --password=""
          - bin/setup
